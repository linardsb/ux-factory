<!DOCTYPE html>
<!-- portal/public/canvas.html — the build canvas (epic #295 ticket #306; .claude/plans/
     canvas-page-run-list-arrangement-ops-306.md, Task 5.1). THE ONE MODULE PAGE in the portal: it
     needs system/ modules a classic script cannot import, so it is a page of its own that the SPA
     links to from #/canvas. Served by server.mjs's PUBLIC_DIR fallback; no route. -->
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas · ux factory portal</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo-neutral.svg" />
  <link rel="stylesheet" href="/system/tokens.contract.css" />
  <link rel="stylesheet" href="/system/tokens.neutral.css" />
  <link rel="stylesheet" href="/system/components.css" />
  <link rel="stylesheet" href="/system/studio.css" />
  <link rel="stylesheet" href="/portal.css" />
</head>
<body data-page="portal-canvas">

  <header class="portal-bar">
    <a class="portal-brand" href="/#/canvas">ux factory <span class="hl">portal</span></a>
    <span class="portal-bar-spacer"></span>
  </header>

  <main class="cv-main">
    <div class="cv-toolbar">
      <div class="cv-toolbar-text">
        <p class="cv-label" data-canvas-label>Loading…</p>
        <p class="cv-where" data-canvas-where></p>
      </div>
      <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="annotate">Add note</button>
      <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="import" aria-controls="cv-import-panel">Import</button>
      <span class="cv-lanes">
        <label class="cv-lane-label" for="cv-lane">Lane</label>
        <select id="cv-lane" class="cv-lane-select" data-canvas-lane></select>
        <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="lane-new">New lane</button>
        <span class="cv-lane-new" data-canvas-lane-form hidden>
          <label class="cv-lane-label" for="cv-lane-key">Key</label>
          <input id="cv-lane-key" class="cv-lane-key" data-canvas-lane-key maxlength="24" autocomplete="off" />
          <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="lane-create">Create</button>
        </span>
        <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="lane-keep" hidden>Keep lane</button>
        <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="lane-discard" hidden>Discard lane</button>
      </span>
      <button class="btn btn-secondary cv-btn" type="button" data-canvas-verb="pack">Write handoff pack</button>
      <p class="cv-save" role="status" data-canvas-save></p>
    </div>
    <section class="cv-import-view" data-import-view hidden></section>
    <div class="cv-layout">
      <div class="cv-stage" data-studio-canvas></div>
      <aside class="cv-rail">
        <div class="cv-import" id="cv-import-panel" data-import-panel hidden></div>
        <section class="cv-compose" data-compose-panel aria-label="Compose"></section>
        <section class="cv-groups" data-groups-panel aria-label="Promoted group" hidden></section>
        <section class="cv-flow" data-canvas-flow aria-label="Flow for this lane">
          <h2 class="cv-flow-title">Flow</h2>
          <pre class="cv-flow-text" data-canvas-flow-text></pre>
          <ul class="cv-flow-missing" data-canvas-flow-missing></ul>
        </section>
        <div data-studio-minimap></div>
        <div data-studio-layers></div>
      </aside>
    </div>
  </main>

  <div popover="auto" class="cv-inspector" id="cv-inspector"></div>

  <script type="module" src="/canvas.mjs"></script>
  <script type="module" src="/canvas-import.mjs"></script>
</body>
</html>
