# verify.yml — CI verification gates (epic #1, ticket #9).
# Runs four gates on push to main + every PR:
#   drift-check  — regenerates the committed generators/artifacts, fails on any divergence; also pins the
#                  group count stated in build-checks' ✓ line, CLAUDE.md and gates.md.
#   token-lint   — undeclared / orphan / DTCG-valid contract checks.
#   build-checks — /build's pattern chain: rules, slots, compositions against the real vocabulary,
#                  the share codec + its tamper battery, SVG escaping, the vetting invariant, and
#                  group 8 the OPERATOR PATH (portal/lib/builder.mjs) — whose central invariant this
#                  job proves BY AN ABSENCE. See the warning on the Build checks step below before
#                  touching that step: portal/ must never get an npm ci here.
#   visual       — Playwright screenshots of the shipped pages (6 IA + /roundtrip + /build + 2
#                  data-connected proto = 10 pages, 20 PNGs) under the neutral pack + one client
#                  pack (saulera, applied by swapping the one tokens.neutral.css link), pixel-diffed
#                  vs committed baselines. Runs in the pinned Playwright image so rendering is
#                  byte-stable across platforms.
# The visual gate lands here; #9 stays open pending the deferred interactive-surface follow-up
# (derive/agentic/trace), so this workflow is Part of #9, not its closure.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Least privilege — the job only checks out code and runs local scripts (never the GitHub API).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pin Node 24 — a version the runner image actually caches. Node 20 was the original pin
      # (it matched the local baseline the committed artifacts were generated against), but it
      # EOL'd in April 2026 and aged off the ubuntu-latest tool cache, so setup-node downloaded a
      # ~30 MB tarball from github.com/actions/node-versions on EVERY run — a gating job with a
      # live external network dependency, red for reasons unrelated to the diff (#154).
      #
      # What the pin still buys: Style Dictionary output + generator determinism don't silently
      # move under the runner. CI Node is no longer the local baseline (that stays v20.20.2), so
      # this now rests on measurement rather than on the two being the same number: at #154 every
      # committed artifact was regenerated in a clean clone on linux/x64 under 24.18.0 and 22.23.1
      # and came back byte-identical, all three SD targets (css/ios/android) included. The
      # drift-check step below is the live guard — it goes red, naming the file, on any drift.
      #
      # Keep this a MAJOR. The tool cache only holds what the current image ships, so pinning
      # 24.18.0 exactly would silently restore that download the moment the image moves to
      # 24.19.0 — undoing this ticket while looking like a tightening.
      #
      # This pin is the Node the `run:` steps execute on, and it is NOT what the actions' own v7
      # bump changed — that was their internal runtime (node20 → node24), which GitHub was already
      # forcing. The two are independent: bumping the action does not move the generators' baseline,
      # and a runtime-deprecation notice is still not the thing that moves this number. Cache
      # eviction is, which is what happened here.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Style Dictionary is the one dependency-carrying tool; gen-handoff child-process-invokes
      # it, so its node_modules must exist before drift-check runs. Lockfile present → npm ci.
      - name: Install Style Dictionary
        run: npm ci
        working-directory: tooling/style-dictionary
      - name: Drift check
        run: node tooling/drift-check.mjs
      - name: Token lint
        run: node tooling/token-lint.mjs
      # /build's chain: the pattern rules, the slot derivations, both compositions against the REAL
      # generated vocabulary, the share codec's round trip and its 32-payload tamper battery, SVG
      # escaping, and the one-application-point invariant. Registered here because check 3's whole
      # job is to fail when a vocabulary regeneration breaks the builder — a guarantee that only
      # holds if something runs it without being asked (epic #134, tickets #137 and #138).
      #
      # ⚠ DO NOT ADD AN `npm ci` FOR portal/ TO THIS JOB. Group 8 imports portal/lib/builder.mjs,
      # and its central invariant — nothing in that module's graph reaches
      # @anthropic-ai/claude-agent-sdk, so the SDK loads only when a real run actually starts — is
      # proven by the ABSENCE of portal/node_modules here. Installing portal deps to turn a red job
      # green does not fix the failure; it DELETES the check, and this step keeps printing
      # "all 8 groups pass" afterwards. A red group 8 with "Cannot find package
      # '@anthropic-ai/claude-agent-sdk'" means someone added a static SDK import under portal/lib/
      # — that import is the bug (epic #134, ticket #140). The npm ci steps above are deliberately
      # scoped to tooling/style-dictionary and tooling/visual-regression only.
      - name: Build checks
        run: node tooling/build-checks.mjs

  visual:
    runs-on: ubuntu-latest
    # D11 VR-freeze (epic #70): every v3 beat legitimately re-skins the shipped pages, so the pixel
    # baselines churn by design during v3 dev. On feature/v3-* branches the gate still RUNS and reports
    # (regressions stay visible in the run log + the uploaded diff report), but a failure no longer
    # blocks — #82 removes this line and does the full baseline regen + VR re-block at the final v3
    # merge. On main (github.head_ref empty → false) and every non-v3 branch, VR blocks as normal.
    continue-on-error: ${{ startsWith(github.head_ref, 'feature/v3-') }}
    # Pinned Playwright image — browsers are baked in at this exact tag; the tag MUST equal the
    # @playwright/test version pinned in tooling/visual-regression (v1.61.1-jammy ↔ 1.61.1), else
    # the browser build differs from the one the baselines were rendered against.
    container: mcr.microsoft.com/playwright:v1.61.1-jammy
    # Least privilege — checks out code, runs the browser gate, uploads a report artifact on failure.
    # Never touches the GitHub API; artifact upload needs no contents:write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Playwright (JS)
        run: npm ci
        working-directory: tooling/visual-regression
      - name: Visual regression
        run: npx playwright test
        working-directory: tooling/visual-regression
      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tooling/visual-regression/playwright-report/
          retention-days: 7
