# verify.yml — CI verification gates (epic #1, ticket #9; the security gate, ticket #387).
# Runs on push to main + every PR:
#   drift-check  — regenerates the committed generators/artifacts, fails on any divergence; also pins the
#                  group count stated in build-checks' ✓ line, CLAUDE.md and gates.md.
#   token-lint   — undeclared / orphan / DTCG-valid contract checks.
#   build-checks — /build's pattern chain: rules, slots, compositions against the real vocabulary,
#                  the share codec + its tamper battery, SVG escaping, the vetting invariant, and
#                  group 8 the OPERATOR PATH (portal/lib/builder.mjs) — whose central invariant this
#                  job proves BY AN ABSENCE. See the warning on the Build checks step below before
#                  touching that step: portal/ must never get an npm ci here.
#   visual       — Playwright screenshots of the shipped pages (6 IA + /roundtrip + /build + 2
#                  data-connected proto = 10 pages, 20 PNGs) under the neutral pack + one client
#                  pack (saulera, applied by swapping the one tokens.neutral.css link), pixel-diffed
#                  vs committed baselines. Runs in the pinned Playwright image so rendering is
#                  byte-stable across platforms.
#   codeql       — GitHub's own static analysis over the hand-written source, plus OUR step that reads
#                  the alerts back and fails on high or critical. PR-only for the gate; the scan also
#                  runs on push to main, which is what seeds the Security-tab baseline.
#   audit        — the npm advisory DELTA between the PR's base SHA and its head. PR-only.
#   ready-pr     — THE DRAFT EDGE (#387). piv-create-pr opens every PR as a draft and this is the only
#                  thing that flips it: bash reading job results, no model. A red gate leaves the PR a
#                  draft carrying the red check. What it cannot reach → .claude/references/gates.md.
# The visual gate lands here; #9 stays open pending the deferred interactive-surface follow-up
# (derive/agentic/trace), so this workflow is Part of #9, not its closure.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Least privilege — the job only checks out code and runs local scripts (never the GitHub API).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pin Node 24 — a version the runner image actually caches. Node 20 was the original pin
      # (it matched the local baseline the committed artifacts were generated against), but it
      # EOL'd in April 2026 and aged off the ubuntu-latest tool cache, so setup-node downloaded a
      # ~30 MB tarball from github.com/actions/node-versions on EVERY run — a gating job with a
      # live external network dependency, red for reasons unrelated to the diff (#154).
      #
      # What the pin still buys: Style Dictionary output + generator determinism don't silently
      # move under the runner. CI Node is no longer the local baseline (that stays v20.20.2), so
      # this now rests on measurement rather than on the two being the same number: at #154 every
      # committed artifact was regenerated in a clean clone on linux/x64 under 24.18.0 and 22.23.1
      # and came back byte-identical, all three SD targets (css/ios/android) included. The
      # drift-check step below is the live guard — it goes red, naming the file, on any drift.
      #
      # Keep this a MAJOR. The tool cache only holds what the current image ships, so pinning
      # 24.18.0 exactly would silently restore that download the moment the image moves to
      # 24.19.0 — undoing this ticket while looking like a tightening.
      #
      # This pin is the Node the `run:` steps execute on, and it is NOT what the actions' own v7
      # bump changed — that was their internal runtime (node20 → node24), which GitHub was already
      # forcing. The two are independent: bumping the action does not move the generators' baseline,
      # and a runtime-deprecation notice is still not the thing that moves this number. Cache
      # eviction is, which is what happened here.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Style Dictionary is the one dependency-carrying tool; gen-handoff child-process-invokes
      # it, so its node_modules must exist before drift-check runs. Lockfile present → npm ci.
      - name: Install Style Dictionary
        run: npm ci
        working-directory: tooling/style-dictionary
      - name: Drift check
        run: node tooling/drift-check.mjs
      - name: Token lint
        run: node tooling/token-lint.mjs
      # /build's chain: the pattern rules, the slot derivations, both compositions against the REAL
      # generated vocabulary, the share codec's round trip and its 32-payload tamper battery, SVG
      # escaping, and the one-application-point invariant. Registered here because check 3's whole
      # job is to fail when a vocabulary regeneration breaks the builder — a guarantee that only
      # holds if something runs it without being asked (epic #134, tickets #137 and #138).
      #
      # ⚠ DO NOT ADD AN `npm ci` FOR portal/ TO THIS JOB. Group 8 imports portal/lib/builder.mjs,
      # and its central invariant — nothing in that module's graph reaches
      # @anthropic-ai/claude-agent-sdk, so the SDK loads only when a real run actually starts — is
      # proven by the ABSENCE of portal/node_modules here. Installing portal deps to turn a red job
      # green does not fix the failure; it DELETES the check, and this step keeps printing
      # "all 8 groups pass" afterwards. A red group 8 with "Cannot find package
      # '@anthropic-ai/claude-agent-sdk'" means someone added a static SDK import under portal/lib/
      # — that import is the bug (epic #134, ticket #140). The npm ci steps above are deliberately
      # scoped to tooling/style-dictionary and tooling/visual-regression only.
      - name: Build checks
        run: node tooling/build-checks.mjs

  visual:
    runs-on: ubuntu-latest
    # #387: needs.<job>.result cannot see past the D11 continue-on-error below — a laundered
    # failure reports success, and needs exposes no second field with the truth
    # (actions/toolkit#1739). ready-pr reads THIS instead, which the flag cannot touch.
    outputs:
      gate: ${{ steps.gate.outputs.result }}
    # D11 VR-freeze (epic #70): every v3 beat legitimately re-skins the shipped pages, so the pixel
    # baselines churn by design during v3 dev. On feature/v3-* branches the gate still RUNS and reports
    # (regressions stay visible in the run log + the uploaded diff report), but a failure no longer
    # blocks — #82 removes this line and does the full baseline regen + VR re-block at the final v3
    # merge. On main (github.head_ref empty → false) and every non-v3 branch, VR blocks as normal.
    continue-on-error: ${{ startsWith(github.head_ref, 'feature/v3-') }}
    # Pinned Playwright image — browsers are baked in at this exact tag; the tag MUST equal the
    # @playwright/test version pinned in tooling/visual-regression (v1.61.1-jammy ↔ 1.61.1), else
    # the browser build differs from the one the baselines were rendered against.
    container: mcr.microsoft.com/playwright:v1.61.1-jammy
    # Least privilege — checks out code, runs the browser gate, uploads a report artifact on failure.
    # Never touches the GitHub API; artifact upload needs no contents:write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Playwright (JS)
        run: npm ci
        working-directory: tooling/visual-regression
      # continue-on-error so the job keeps running and the outcome below is capturable; the
      # `Fail on a red gate` step restores today's behaviour exactly (#387).
      - name: Visual regression
        id: vr
        continue-on-error: true
        run: npx playwright test
        working-directory: tooling/visual-regression
      # NOT `failure()`: with the step-level continue-on-error above, the job's status here is
      # still success, so failure() would be false and the diff report would silently stop uploading.
      - name: Upload diff report
        if: steps.vr.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tooling/visual-regression/playwright-report/
          retention-days: 7

      # `outcome` is the PRE-continue-on-error result; `conclusion` is the laundered one. Using
      # conclusion here would produce a check that always says success.
      - name: Record the gate outcome
        id: gate
        if: always()
        env:
          OUTCOME: ${{ steps.vr.outcome }}
        run: echo "result=$OUTCOME" >> "$GITHUB_OUTPUT"
      - name: Fail on a red gate
        if: steps.vr.outcome != 'success'
        env:
          OUTCOME: ${{ steps.vr.outcome }}
        run: |
          echo "::error::visual regression $OUTCOME"
          exit 1

  codeql:
    # S1 (#387) — GitHub's own static analysis. Runs on PRs AND on push to main: main's analysis is
    # the repo's Security-tab baseline, and the FIRST push to main after this merges is what seeds
    # it. Until then the only unscanned base is this PR's own.
    #
    # CodeQL UPLOADS; it does not fail on findings. `analyze` has no fail-on input (read its
    # action.yml). The gate is the `Require no high or critical alerts` step below, which is ours —
    # delete that step and CodeQL keeps running, the Security tab keeps filling, and nothing holds
    # a PR.
    #
    # No fetch-depth: 0 — CodeQL builds its database from the checked-out tree and needs no history.
    runs-on: ubuntu-latest
    # From GitHub's own starter workflow. security-events: write is what lets the action upload the
    # SARIF, and it covers the read the gate step needs. A PR from a FORK gets security-events: read
    # only, so the upload fails, this job fails, and the PR stays a draft (no forks today).
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        # Pin the MAJOR here, unlike the rest of this workflow: GitHub ships CodeQL bundle updates
        # through it, and a pinned patch goes stale silently.
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
      # THE GATE. CodeQL uploads and goes green on findings — `analyze` has no fail-on input — so the
      # alerts are read back and judged here. PR-only: on a push to main there is no pull-request ref
      # to query, and main's analysis is the baseline rather than a gate.
      #
      # `analyze`'s wait-for-processing defaults to true, which is why this can query immediately
      # without polling; set it to false and this gate races the upload and starts passing vacuously.
      #
      # Filter CLIENT-SIDE on rule.security_severity_level — the API's own `severity=` parameter is
      # the rule's alert severity (error/warning/note), a different axis.
      - name: Require no high or critical alerts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          # POSITIVE CONTROL, and it runs first: zero alerts because nothing was analyzed looks exactly
          # like zero alerts because the code is clean.
          n_analyses=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/analyses?ref=$REF&tool_name=CodeQL" --jq 'length')
          if [ "$n_analyses" -lt 1 ]; then
            echo "::error::no CodeQL analysis on $REF — this gate measured nothing"; exit 1
          fi
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=$REF&state=open&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")
                  | "\(.rule.security_severity_level)\t\(.rule.id)\t\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' \
            > "$RUNNER_TEMP/codeql-blocking.tsv"
          if [ -s "$RUNNER_TEMP/codeql-blocking.tsv" ]; then
            echo "::error::CodeQL found $(wc -l < "$RUNNER_TEMP/codeql-blocking.tsv") blocking alert(s)"
            cat "$RUNNER_TEMP/codeql-blocking.tsv"
            exit 1
          fi
          echo "CodeQL: no high or critical alerts on $REF ($n_analyses analysis/analyses read)"

  audit:
    # S2 (#387) — the dependency-advisory DELTA, not a fail-on-severity gate. The repo carries three
    # dependency-carrying tooling dirs and no shipped runtime deps; the pre-existing style-dictionary
    # advisories are build-time and must NOT block, so the gate compares base against head and fails
    # only on an advisory ID the base did not carry.
    # PR-only: there is no base to diff against on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Least privilege — checks out code and runs one local script; never touches the GitHub API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit must be reachable for `git show <base-sha>:<path>`; checkout's default
          # depth of 1 fetches only the merge ref.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dependency advisory delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tooling/audit-delta.mjs "$BASE_SHA"

  ready-pr:
    # O1 (#387) — THE EDGE. piv-create-pr opens every PR as a draft; this is the only thing that takes
    # it out of one, and it is bash reading job results. No model, no judgement.
    #
    # `!cancelled()` is load-bearing: with `needs:` alone, a failed need SKIPS this job, and the result
    # checks below — the whole point of the job — would never execute in the one case they exist for.
    # With it, they run and they name the job that was red.
    #
    # STANDING RULE: any job added to `needs:` that carries a job-level `continue-on-error` MUST publish
    # its true step outcome as a job output and be checked here the way `visual` is.
    # `needs.<job>.result` reports success for a laundered failure and there is no second field
    # (actions/toolkit#1739), so adding such a job without its output silently deletes this gate.
    #
    # No `types:` on the `on:` block above: pull_request's defaults are opened/synchronize/reopened,
    # `ready_for_review` is not among them, and GITHUB_TOKEN-triggered events start no new run anyway.
    needs: [verify, visual, codeql, audit]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # The ONE job that widens past contents: read, and only to what `gh pr ready` needs.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require every gate green
        env:
          VERIFY: ${{ needs.verify.result }}
          VISUAL: ${{ needs.visual.result }}
          VISUAL_GATE: ${{ needs.visual.outputs.gate }}
          CODEQL: ${{ needs.codeql.result }}
          AUDIT: ${{ needs.audit.result }}
        # `set -e` is deliberately absent: with it, the first non-zero comparison would abort before the
        # remaining jobs are reported, so a run with three red jobs would name one.
        run: |
          set -uo pipefail
          red=0
          for pair in "verify:$VERIFY" "visual:$VISUAL" "codeql:$CODEQL" "audit:$AUDIT"; do
            name=${pair%%:*}; res=${pair#*:}
            if [ "$res" != "success" ]; then
              echo "::error::$name did not succeed (result=${res:-<empty>})"; red=1
            fi
          done
          # A job-level continue-on-error launders a failure into result=success and needs exposes no
          # field with the truth (actions/toolkit#1739). The visual job carries such a flag for the D11
          # VR freeze, so its REAL step outcome is read from its own job output. An empty value — a
          # failed job whose output did not propagate — is not "success" either, so this fails closed.
          if [ "${VISUAL_GATE:-}" != "success" ]; then
            echo "::error::visual gate outcome=${VISUAL_GATE:-<empty>}"; red=1
          fi
          [ "$red" -eq 0 ]
      # THE ONE PREREQUISITE, and it is not optional. GITHUB_TOKEN CANNOT take a PR out of draft:
      # markPullRequestReadyForReview answers FORBIDDEN "Resource not accessible by integration" even
      # with pull-requests: write in the job's own token block, and REST's PATCH /pulls/{n} has no
      # draft field, so GraphQL is the only route. Measured at #387 on PR #389, three ways: via
      # `gh pr ready`, via the mutation directly, and again with the repo's
      # `can_approve_pull_request_reviews` flipped to true — which is NOT the cause and was restored.
      #
      # So this step needs READY_PR_TOKEN: a fine-grained PAT scoped to THIS repo with
      # `Pull requests: write` and nothing else. It refuses by name when the secret is absent rather
      # than failing on a raw FORBIDDEN, and it is never handed to a fork — `pull_request` runs from
      # forks receive no secrets, which is also why a fork PR can never leave draft here.
      - name: Flip the PR out of draft
        env:
          GH_TOKEN: ${{ secrets.READY_PR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::READY_PR_TOKEN is not set — the draft flip has no credential that can perform it, and GITHUB_TOKEN cannot (see .claude/references/gates.md). The PR stays a draft."
            exit 1
          fi
          # The mutation directly, not `gh pr ready`: same call, but gh wraps the failure in its own
          # message (cli/cli#1314).
          gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
            -f id="$PR_NODE_ID"
          # Assert the flip; never trust the exit code. Mutate, don't grep.
          draft=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)
          [ "$draft" = "false" ] || { echo "::error::PR $PR is still a draft"; exit 1; }
