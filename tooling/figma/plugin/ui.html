<!doctype html>
<!-- tooling/figma/plugin/ui.html — hand-written canon (this repo; not generated). The house plugin's window
     (epic #295 ticket #310; docs/figma-runbook.md § C): the export JSON in a read-only textarea, with
     Download and a Copy fallback, because whether a download fires inside Figma's plugin iframe is
     unconfirmed. A tool window inside Figma, not a shipped page, so the token contract does not apply and
     the styles are inline with system fonts. Text is only ever set through .value / .textContent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px; height: 100vh; display: flex; flex-direction: column; gap: 8px;
         font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #fff; color: #222; }
  textarea { flex: 1; width: 100%; resize: none; font: 11px/1.4 ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 4px 12px; }
</style>
</head>
<body>
<textarea id="out" readonly spellcheck="false"></textarea>
<div class="row">
  <button id="download" type="button">Download</button>
  <button id="copy" type="button">Copy</button>
  <span id="status" role="status"></span>
</div>
<script>
  var ta = document.getElementById("out");
  var status = document.getElementById("status");
  var fileName = "selection.export.json";

  onmessage = function (e) {
    var m = e.data.pluginMessage;
    if (!m || m.type !== "export") return;
    ta.value = m.json;
    var slug = String(m.name || "selection").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    fileName = (slug || "selection") + ".export.json";
    status.textContent = fileName;
  };

  document.getElementById("download").onclick = function () {
    var url = URL.createObjectURL(new Blob([ta.value], { type: "application/json" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    status.textContent = "Download requested: " + fileName;
  };

  document.getElementById("copy").onclick = function () {
    var fallback = function () {
      ta.select();
      status.textContent = document.execCommand("copy") ? "Copied" : "Copy failed — select all and copy by hand";
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () { status.textContent = "Copied"; }, fallback);
    } else fallback();
  };
</script>
</body>
</html>
